upstream vibudget_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # The API, its OpenAPI contract and the health probe share the site's
    # origin so that the browser never makes a cross-origin request.
    location ~ ^/(api|docs|redoc|openapi\.json|health) {
        proxy_pass http://vibudget_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
